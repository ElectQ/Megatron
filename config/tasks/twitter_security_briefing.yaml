# 推特安全流每日分析 —— 门铃推送 + 日刊页。
# 文件是「种子」：首启若库里没有同名任务就创建；之后可在后台改，UI 赢。
name: twitter_security_briefing
description: 每日推特安全信息流分级（门铃 + 日刊）
source: twitter_security_list
prompt: daily_intel_v1
provider: deepseek
schedule_cron: "0 1 * * *"      # 01:00 UTC = 09:00 北京（晚于 22:30 UTC 拉取）
channels: [钉钉安全简报, 企业微信安全简报]  # 正式任务同时推送两端
filter_config:
  time_mode: today
  output_mode: day_bundle
  # 单次要求模型回填上百条 JSON 容易撞输出上限；分批分析后统一全局排序。
  analysis_batch_size: 25
  max_items: 0
  filters: []
